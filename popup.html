<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 14px;
        font-family: Roboto, Arial, sans-serif;
        font-size: 13px;
        color: #1f2328;
      }
      h1 { font-size: 15px; margin: 0 0 8px; }
      p { color: #57606a; line-height: 1.5; margin: 0 0 10px; }
      a.btn {
        display: block;
        text-align: center;
        padding: 8px;
        background: linear-gradient(135deg, #0ea5e9, #2563eb);
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
      ol { padding-left: 18px; margin: 0 0 10px; color: #57606a; }
      li { margin-bottom: 4px; }
      .tag { color: #137a3f; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>📍 LeadPin</h1>
    <p>Outreach-ready leads from Google Maps. <span class="tag">100% local</span> — no server, login or license.</p>
    <ol>
      <li>Open Google Maps</li>
      <li>Search a business</li>
      <li>Click <b>Start</b> on the panel</li>
      <li>Export <b>Sheets / Excel / CSV</b></li>
    </ol>
    <a class="btn" href="https://www.google.com/maps" target="_blank"
      >Open Google Maps</a
    >
  </body>
</html>
